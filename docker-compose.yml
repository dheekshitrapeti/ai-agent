services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workspace_assistant
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
